name: Pages

# Builds the docs (pmndrs/docs) and the examples site into one GitHub Pages artifact.
# RELEASING.md section 3. The build mirrors the reusable workflow
# pmndrs/docs/.github/workflows/build.yml@v4 (same npx command and env) but runs it directly,
# because a repo gets one Pages site and the examples site (RELEASING section 4) goes into the
# same artifact under out/examples/.
#
# OWNER: Settings -> Pages -> Source: GitHub Actions (the deploy job fails until it is set).
# Manual only until then, so pushes to main don't fail. After setting the source, add:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_PATH: /vdb
    steps:
      # Full history and tags for the version label in the sidebar footer (git describe).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs site (pmndrs/docs)
        run: npx -y @pmndrs/docs@4 build docs/site out --format website
        env:
          NEXT_PUBLIC_LIBNAME: vdb
          BASE_PATH: ${{ env.BASE_PATH }}
          HOME_REDIRECT: /getting-started/introduction
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/docs/site
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.ref_name }}/docs/site
          NEXT_PUBLIC_URL: https://pmndrs.github.io/vdb
          # TODO(owner): pick the docs header icon (emoji) and logo (path or URL); the emoji is a placeholder.
          ICON: "🧊"
          LOGO: ""
          GITHUB: https://github.com/pmndrs/vdb
          DISCORD: ""
          CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Check llms-full.txt was emitted
        run: test -s out/llms-full.txt && test -s out/llms.txt

      # RELEASING section 4: the examples site at /vdb/examples/. The volumes are too big to fetch in CI (WDAS is a
      # 2.8 GB zip plus a conversion), so a prebuilt tarball comes from a GitHub Release on this repo
      # (examples-assets-v1, asset examples-assets.tar; the owner uploads it with scripts/examples-assets.mjs --pack,
      # RELEASING.md section 4). Its sha256 is pinned in examples/assets.manifest.json. A missing or mismatched
      # tarball fails the job: a broken examples site never deploys.
      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Examples site (Vite, base /vdb/examples/)
        run: pnpm --filter @webvdb/examples build
        env:
          VDB_EXAMPLES_BASE: ${{ env.BASE_PATH }}/examples/

      - name: Examples assets (release tarball)
        run: |
          set -euo pipefail
          tag=$(node -p "require('./examples/assets.manifest.json').release.tag")
          asset=$(node -p "require('./examples/assets.manifest.json').release.asset")
          test -n "$(node -p "require('./examples/assets.manifest.json').release.sha256 || ''")" \
            || { echo "::error::examples/assets.manifest.json release.sha256 is null: the owner has not published the asset tarball (RELEASING.md section 4)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/examples-assets"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern "$asset" --dir "$RUNNER_TEMP/examples-assets" \
            || { echo "::error::release $tag / $asset not found on ${{ github.repository }}: run scripts/examples-assets.mjs --pack and upload it (RELEASING.md section 4)"; exit 1; }
          node scripts/examples-assets.mjs --from-tar "$RUNNER_TEMP/examples-assets/$asset" --out examples/dist/fixtures --verify-dir examples/dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy examples into the Pages artifact
        run: |
          mkdir -p out/examples
          cp -R examples/dist/. out/examples/
          test -s out/examples/index.html && test -s out/examples/attribution.html && test -d out/examples/fixtures

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
